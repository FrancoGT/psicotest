services:
  app:
    build: .
    image: psicotest:latest
    ports:
      - "8080:80"
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      app_baseURL: ${APP_BASE_URL:-http://localhost:8080/}
      database_default_hostname: db
      database_default_database: ${DB_DATABASE:-psicotest}
      database_default_username: ${DB_USERNAME:-psicotest}
      database_default_password: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      database_default_DBDriver: Postgre
      database_default_port: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-psicotest}
      POSTGRES_USER: ${DB_USERNAME:-psicotest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
